# Lint (Google style: ShellCheck, lintr), the full test suite with the conda
# environments (as on a cluster) and in the Docker image (as on one computer),
# on every push and pull request
name: tests

on:
  push:
  pull_request:

jobs:

  lint-bash:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck (settings in .shellcheckrc)
        run: shellcheck run_pipeline.sh check_status.sh scripts/*.sh reference/*.sh tests/*.sh docker/*.sh
      - name: Lines of at most 80 characters
        run: |
          ! awk 'length > 80 { print FILENAME ":" FNR; found = 1 } END { exit !found }' \
            run_pipeline.sh check_status.sh scripts/*.sh reference/*.sh tests/*.sh docker/*.sh

  lint-r:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true    # binary R packages: minutes, not 20+
      - name: Install lintr
        run: Rscript -e 'install.packages("lintr")'
      - name: lintr (settings in .lintr)
        run: |
          Rscript -e 'lints <- lintr::lint_dir("scripts/R"); print(lints); quit(status = length(lints) > 0)'

  pipeline:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          conda-remove-defaults: "true"

      - name: Create the pipeline conda environments (envs/*.yml)
        run: |
          conda env create -f envs/cutrun.yml
          conda env create -f envs/cutrun_r.yml

      # FlexPeak is tested when it is installed in the cutrun environment, e.g.
      #   conda run -n cutrun pip install "flexpeak[bam] @ git+<FlexPeak repository URL>"

      - name: Run tests (simulated data, FASTQ -> HTML report)
        run: TEST_CONDA_ENV=cutrun TEST_CONDA_ENV_R=cutrun_r bash tests/run_tests.sh

      - name: Keep logs if the tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            tests/test_output/*.log
            tests/test_output/Data/Log/
            tests/test_output/Data/Peak/*/*.log

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build the Docker image (Dockerfile)
        run: docker build --platform linux/amd64 -t cutrunpipeline .

      - name: Run tests in the image
        run: |
          mkdir -p docker_test
          docker run --rm -v "${PWD}/docker_test:/out" cutrunpipeline \
            bash tests/run_tests.sh /out/test_output

      - name: Keep logs if the tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-test-logs
          path: |
            docker_test/test_output/*.log
            docker_test/test_output/Data/Log/
            docker_test/test_output/Data/Peak/*/*.log
